<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ИИ Тренер</title>
<meta name="description" content="Программа под твои цели, подсказки по технике через камеру и дневник прогресса">
<meta name="theme-color" content="#12151f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ИИ Тренер">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="../icon-192.png" type="image/png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Condensed:wght@600;700;800&family=Unbounded:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Two looks, one set of names. «Сумерки» (dark) is the default; «Бенто» (light) is switched on in the profile:
   <html data-theme="bento">. Components never use colours directly — only these tokens. */
:root{
  /* Сумерки */
  --bg:#12151f; --surface:#1c2131; --surface-2:#252b3e; --ink:#f3efe7; --muted:#a9acbc; --line:#2a3044;
  --accent:#c3eb6e; --accent-ink:#12151f; --accent-soft:#2b3522;
  --blue:#9dcbf4; --blue-ink:#12151f; --lime:#c3eb6e; --lime-ink:#12151f; --pink:#f4a9c0; --pink-ink:#12151f; --beige:#e9ddca;
  --good:#c3eb6e; --good-ink:#12151f; --good-soft:#222a1f; --good-text:#c3eb6e; --good-strong:#c3eb6e;
  --warn:#f0b45a; --warn-soft:#33270f; --bad:#ff7a6e; --bad-soft:#3a1a1a;
  --cam-bg:#1f2c3d; --cam-ink:#9dcbf4;
  --hero-bg:#1c2131; --hero-muted:#a9acbc; --hero-line:#2a3044; --hero-step:#252b3e;
  --open-line:#3a4560; --open-n-bg:#9dcbf4; --open-n-ink:#12151f;
  --tip-bg:#2a1f2b; --tip-ink:#f6d3de;
  --chip-on-bg:#9dcbf4; --chip-on-ink:#12151f; --seg-on-bg:#2f3750; --seg-on-ink:#f3efe7;
  --tab-on-bg:#c3eb6e; --tab-on-ink:#12151f;
  --rest-bg:#1c2131; --rest-ink:#f3efe7; --rest-num:#c3eb6e; --rest-btn:#252b3e;
  --cal-has-bg:#2b3522; --cal-has-ink:#c3eb6e; --chart:#9dcbf4;
  --sub-bg:#2a1f2b; --sub-ink:#f3efe7; --sub-line:#f4a9c0; --toast-act:#314a0b;
  --stat1-bg:#1c2131; --stat1-num:#c3eb6e; --stat2-bg:#1c2131; --stat2-num:#f4a9c0; --stat3-bg:#1c2131; --stat3-num:#9dcbf4;
  --path1-bg:#c3eb6e; --path1-ink:#12151f; --path1-sub:#2c3a14;
  --path-bg:#1c2131; --path-ink:#f3efe7; --path-ico-bg:#252b3e; --path-ico:#9dcbf4;
  --load1:#c3eb6e; --load2:#9dcbf4; --load3:#f4a9c0; --load4:#4a5068;
  --card-line:#262c3f; --card-shadow:none; --clay:none;
  --shade:rgba(0,0,0,.6); --lift:0 10px 30px rgba(0,0,0,.5);
  --f-display:"Sofia Sans Condensed","Sofia Sans",system-ui,sans-serif;
  --f-body:"Sofia Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Sofia Sans Condensed","Sofia Sans",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs-body:16px; --w-body:400; --w-strong:700;
  --h1:700 26px/1.1 var(--f-display); --h2:700 22px/1.15 var(--f-display);
  --hero-font:800 34px/1.02 var(--f-display); --hero-case:uppercase;
  --stat-font:800 24px/1.1 var(--f-num); --clock-font:700 17px var(--f-num); --rest-font:800 32px var(--f-num);
  --step-font:700 22px var(--f-num); --big-font:800 19px/1.1 var(--f-display); --big-case:uppercase;
  --r:24px; --r-btn:16px; --col:560px; --tabs-h:64px;
  color-scheme:dark;
}
:root[data-theme="bento"]{
  /* Бенто */
  --bg:#f1e8dc; --surface:#fff8ef; --surface-2:#f7efe4; --ink:#262838; --muted:#5d5a63; --line:#e5d9c9;
  --accent:#262838; --accent-ink:#ffffff; --accent-soft:#cde3f7;
  --blue:#cde3f7; --blue-ink:#16406c; --lime:#d5efa3; --lime-ink:#3d4a1c; --pink:#f8d2dd; --pink-ink:#5a1d36; --beige:#f1e8dc;
  --good:#d5efa3; --good-ink:#262838; --good-soft:#e7f4cc; --good-text:#3d5a12; --good-strong:#7fae32;
  --warn:#8a5300; --warn-soft:#fbe7c4; --bad:#b3261e; --bad-soft:#fbe0dc;
  --cam-bg:#d5efa3; --cam-ink:#3d4a1c;
  --hero-bg:#cde3f7; --hero-muted:#2a4466; --hero-line:rgba(38,40,56,.12); --hero-step:#ffffff;
  --open-line:transparent; --open-n-bg:#262838; --open-n-ink:#ffffff;
  --tip-bg:#f8d2dd; --tip-ink:#5a1d36;
  --chip-on-bg:#262838; --chip-on-ink:#ffffff; --seg-on-bg:#cde3f7; --seg-on-ink:#16406c;
  --tab-on-bg:#cde3f7; --tab-on-ink:#16406c;
  --rest-bg:#262838; --rest-ink:#ffffff; --rest-num:#d5efa3; --rest-btn:rgba(255,255,255,.14);
  --cal-has-bg:#cde3f7; --cal-has-ink:#16406c; --chart:#2f6db3;
  --sub-bg:#f8d2dd; --sub-ink:#262838; --sub-line:transparent; --toast-act:#d5efa3;
  --stat1-bg:#d5efa3; --stat1-num:#262838; --stat2-bg:#f8d2dd; --stat2-num:#5a1d36; --stat3-bg:#fff8ef; --stat3-num:#262838;
  --path1-bg:#cde3f7; --path1-ink:#16406c; --path1-sub:#2a4466;
  --path-bg:#fff8ef; --path-ink:#262838; --path-ico-bg:#d5efa3; --path-ico:#3d4a1c;
  --load1:#2f6db3; --load2:#7fae32; --load3:#d9799a; --load4:#d8ccbb;
  --card-line:transparent; --card-shadow:0 6px 16px rgba(38,40,56,.06);
  --clay:inset 0 2px 0 rgba(255,255,255,.65),0 8px 18px rgba(38,40,56,.07);
  --shade:rgba(38,40,56,.42); --lift:0 10px 26px rgba(38,40,56,.16);
  --f-display:"Unbounded","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Unbounded","Nunito",system-ui,sans-serif;
  --fs-body:15px; --w-body:500; --w-strong:800;
  --h1:600 19px/1.2 var(--f-display); --h2:800 18px/1.25 var(--f-body);
  --hero-font:700 25px/1.18 var(--f-display); --hero-case:none;
  --stat-font:600 17px/1.2 var(--f-num); --clock-font:600 14px var(--f-num); --rest-font:700 22px var(--f-num);
  --step-font:800 18px var(--f-body); --big-font:600 15px/1.2 var(--f-display); --big-case:none;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.tab-num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in,.view{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top h1{font:700 19px/1.2 var(--f-display);margin:0;flex:1;letter-spacing:-.01em;text-wrap:balance}
.proto{font-size:12px;color:var(--muted);max-width:var(--col);margin:0 auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.proto b{color:var(--warn);font-weight:600}
.view{padding-block:4px calc(var(--tabs-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabs-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:10px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:center;line-height:1.25;padding-block:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:54px;font-size:16px;border-radius:14px;width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--bad)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.cam{background:var(--accent-soft);color:var(--accent)}
.badge.next{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.new{background:var(--surface-2);color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
h2{font:600 17px/1.3 var(--f-body);margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--f-body);margin:0}
.hint{font-size:13.5px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* today */
.daypick{display:flex;flex-direction:column;gap:12px}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan-list li:first-child{border-top:0}
.plan-list .nm{flex:1;min-width:0}
.plan-list .ds{color:var(--muted);font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.statline{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 18px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* workout */
.wo-head{position:sticky;top:var(--top-h,72px);z-index:15;background:var(--bg);padding-block:4px 8px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .25s}
.clock{font:600 14px var(--f-mono);font-variant-numeric:tabular-nums}
.wx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wx.open{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 2px 10px rgba(29,88,214,.08)}
.wx-h{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 14px;width:100%;text-align:left}
.wx-n{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:var(--surface-2);color:var(--muted)}
.wx.done .wx-n{background:var(--good);color:#fff}
.wx.open .wx-n{background:var(--accent);color:var(--accent-ink)}
.wx-t{flex:1;min-width:0}
.wx-t b{display:block;font-weight:600;line-height:1.3}
.wx-t span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wx-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.coach{margin:0;font-size:14px;background:var(--surface-2);border-radius:10px;padding:9px 11px;line-height:1.4}
.coach.up{background:var(--good-soft)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center}
.set-h{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.set-h span{text-align:center}
.set .i{font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);overflow:hidden}
.step button{height:100%;font-size:20px;line-height:1;color:var(--muted)}
.step button:active{background:var(--line)}
.step input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:0;outline:none}
.check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}
.check svg{width:22px;height:22px}
.set.done .check{background:var(--good);border-color:var(--good);color:#fff}
.set.done .step{background:var(--good-soft);border-color:transparent}
.wx-a{display:flex;gap:8px;flex-wrap:wrap}
.wx-a .btn{flex:1}
.restbar{position:fixed;left:0;right:0;bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rest{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--lift);max-width:var(--col);width:100%}
.rest .t{font:600 22px var(--f-mono);font-variant-numeric:tabular-nums;min-width:66px}
.rest .l{flex:1;font-size:13px;opacity:.75}
.rest button{white-space:nowrap;min-height:38px;padding:0 12px;border-radius:10px;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-weight:600;font-size:14px}
.rest.over .t{color:var(--good)}

/* program */
.days{display:flex;flex-direction:column;gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.day.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--good)}100%{box-shadow:0 0 0 0 transparent}}
.day-h{display:flex;align-items:center;gap:4px;padding:8px 6px 8px 4px}
.grip{width:36px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grip svg{width:18px;height:18px}
.day-t{flex:1;min-width:0;text-align:left;padding:4px 2px}
.day-t b{display:block;font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.day-t span{font-size:13px;color:var(--muted)}
.title-input{width:100%;font-weight:600;font-size:16px;border:1px solid var(--accent);border-radius:8px;padding:6px 8px;background:var(--surface)}
.ex-list{display:flex;flex-direction:column;border-top:1px solid var(--line);min-height:8px}
.day.closed .ex-list,.day.compact .ex-list,.day.compact .day-f{display:none}
.day.closed .day-f{display:none}
.ex{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 4px;border-top:1px solid var(--line);background:var(--surface)}
.ex:first-child{border-top:0}
.ex-m{flex:1;min-width:0;padding:6px 0;text-align:left}
.ex-m b{font-weight:500;display:block;line-height:1.3;overflow-wrap:anywhere}
.ex-m .dz{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.ex-m .dz u{text-decoration:none;border-bottom:1px dashed var(--muted)}
.day-f{display:flex;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.day.drop{outline:2px dashed var(--accent);outline-offset:2px}
.placeholder{opacity:.35}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:var(--lift);transform:rotate(-.6deg) scale(1.02);border-radius:12px;opacity:.96}
.ex.drag-ghost{border:1px solid var(--line)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .btn{flex:1}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:var(--col);max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.full{height:96%;max-height:96%}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet-h h2{flex:1}
.sheet-b{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.sheet-f{padding:10px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:8px;background:var(--bg)}
.sheet-f .btn{flex:1}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;text-align:left;border-top:1px solid var(--line);font-weight:500}
.menu button:first-child{border-top:0}
.menu button.danger{color:var(--bad)}
.menu button[disabled]{opacity:.4}
.menu small{margin-left:auto;color:var(--muted);font-weight:400}
.menu .ck{color:var(--good);font-weight:700;margin-right:-4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
textarea.input{padding:10px 12px;min-height:140px;resize:vertical;font-size:14px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);text-align:left;width:100%;background:var(--surface)}
.cat-item:first-child{border-top:0}
.cat-item b{flex:1;font-weight:500;min-width:0}
.cat-item .plus{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.cat-item.added .plus{background:var(--good);color:#fff;font-size:16px}

/* import */
.drop-zone{border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface)}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px}
.thumb .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:var(--shade);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.thumb .fake{position:absolute;inset:0;padding:30px 8px 8px;display:flex;flex-direction:column;gap:5px}
.thumb .fake i{display:block;height:6px;border-radius:3px;background:var(--line)}
.thumb .fake i:nth-child(3n){width:60%}
.dest{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt[aria-checked="true"] .rd{border:6px solid var(--accent)}
.opt b{display:block;font-weight:600}
.opt span{font-size:13.5px;color:var(--muted)}
.opt select{margin-top:8px}
.rdays{display:flex;flex-direction:column;gap:10px}
.rday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rday-h{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px}
.rday-h input{flex:1;min-width:0;font-weight:600;font-size:16px;border:1px solid transparent;border-radius:8px;padding:4px 6px;background:transparent}
.rday-h input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.rrow{display:grid;grid-template-columns:22px minmax(0,1fr) 44px;gap:8px;align-items:start;padding:9px 6px 9px 12px;border-top:1px solid var(--line)}
.rrow .st{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.st.ok{background:var(--good-soft);color:var(--good)}
.st.check{background:var(--warn-soft);color:var(--warn)}
.st.new{background:var(--surface-2);color:var(--muted)}
.rrow .nm{font-weight:500;line-height:1.3;overflow-wrap:anywhere;text-align:left}
.rrow .mt{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.rrow .mt .badge{margin-left:4px}
.photo-order{position:absolute;bottom:4px;left:4px;right:4px;display:flex;justify-content:space-between;gap:4px}
.photo-order button{width:36px;min-height:36px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:18px}
.photo-order button:disabled{opacity:.35}
.review-day-tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:0 12px 8px}
.review-day-tools .hint{flex:1;min-width:140px}
.review-row-tools{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 12px}
.review-row-tools button{min-height:40px;padding:6px 0;color:var(--accent);font-size:13px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.import-count{display:flex;flex-direction:column;gap:10px}
.import-save{width:100%;display:flex;flex-direction:column;gap:8px}
.import-save .row{display:flex;gap:8px}
.import-save .row .btn{flex:1;min-width:0}
.import-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.import-note p{width:100%;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.ex-coach-note{display:block;margin-top:6px;font-size:13px;font-weight:400;color:var(--muted);white-space:normal}
.split{display:flex;justify-content:center}
.split button{font-size:13px;color:var(--accent);font-weight:600;padding:4px 10px}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-lines{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px;margin:0 auto}
.scan-lines div{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fade .3s both}

/* diary */
.cal{padding:12px}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-h b{flex:1;font-weight:600;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g .wd{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal-d{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.cal-d.has{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-d.out{visibility:hidden}
.sumline{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:10px}
.sumline b{color:var(--ink);font-weight:600}
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.log-h{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.log-d{width:46px;flex:none;text-align:center;line-height:1.1}
.log-d b{display:block;font:700 18px var(--f-display)}
.log-d span{font-size:11.5px;color:var(--muted);text-transform:uppercase;font-weight:600}
.log-b{border-top:1px solid var(--line);padding:6px 14px 12px}
.log-ex{padding:8px 0;border-top:1px solid var(--line)}
.log-ex:first-child{border-top:0}
.log-ex b{font-weight:500;display:block;margin-bottom:6px}
.sets-chips{display:flex;flex-wrap:wrap;gap:6px}
.sc{font-size:13.5px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sc.add{color:var(--accent);border-style:dashed;background:transparent}
.chart-card{padding:14px}
.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.end{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:600;font-family:var(--f-body)}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;border-radius:8px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
table.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.hist th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:6px 4px}
table.hist td{padding:8px 4px;border-top:1px solid var(--line)}
table.hist td:last-child{white-space:nowrap}

/* profile */
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.prow:first-child{border-top:0}
.prow span{flex:1;min-width:0}
.prow small{color:var(--muted);font-size:14px;text-align:right}
.sub{padding:16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.sub b.big{font:700 20px/1.2 var(--f-display)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 98px);z-index:80;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--lift);width:max-content;max-width:calc(100% - 32px);font-size:14px;animation:up .2s}
.toast button{color:var(--accent);font-weight:700;padding:6px 8px;filter:brightness(1.4)}

/* ---------- theme layer: components of «Бенто» / «Сумерки» ---------- */
body{font-size:var(--fs-body);font-weight:var(--w-body)}
b,strong{font-weight:var(--w-strong)}
.top h1{font:var(--h1)}
h2{font:var(--h2)}
.card,.day,.wx,.log,.rday,.plist,.menu,.stat,.opt{border-color:var(--card-line);box-shadow:var(--card-shadow)}
.card,.day,.wx,.log,.rday,.plist,.menu{border-radius:var(--r)}
.btn{min-height:48px;border-radius:var(--r-btn);font-weight:var(--w-strong)}
.btn.big{min-height:58px;border-radius:20px;font:var(--big-font);text-transform:var(--big-case);letter-spacing:.01em}
.btn.sm{min-height:40px;border-radius:12px}
.icon-btn{width:44px;height:44px;border-radius:14px}
.chip{min-height:40px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:var(--chip-on-bg)}
.badge{font-weight:700}
.badge.cam{background:var(--cam-bg);color:var(--cam-ink)}
.badge.next{background:var(--good-soft);color:var(--good-text)}
.seg{border-radius:16px;padding:4px}
.seg button{min-height:40px;border-radius:12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--seg-on-bg);color:var(--seg-on-ink);box-shadow:none}
.input{border-radius:14px}
.sheet{border-radius:28px 28px 0 0}
/* floating tab bar */
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:calc(var(--col) - 8px);margin:0 auto;border:1px solid var(--card-line);border-radius:26px;box-shadow:var(--lift);padding:5px}
.tabs-in{gap:4px}
.tab{border-radius:20px;font-weight:700}
.tab[aria-current="page"]{background:var(--tab-on-bg);color:var(--tab-on-ink)}
.tab .dot{background:var(--good-strong);box-shadow:0 0 0 2px var(--tab-on-bg)}
.view{padding-bottom:calc(var(--tabs-h) + 124px + env(safe-area-inset-bottom,0px))}
.restbar{bottom:calc(var(--tabs-h) + 32px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(var(--tabs-h) + 120px + env(safe-area-inset-bottom,0px))}
.toast button{color:var(--toast-act);filter:none}
/* today: tiles */
.statline .stat,.kpis .stat{border:0;border-radius:20px;box-shadow:var(--clay)}
.statline .stat:nth-child(1){background:var(--stat1-bg)}
.statline .stat:nth-child(1) b{color:var(--stat1-num)}
.statline .stat:nth-child(2){background:var(--stat2-bg)}
.statline .stat:nth-child(2) b{color:var(--stat2-num)}
.statline .stat:nth-child(3){background:var(--stat3-bg)}
.statline .stat:nth-child(3) b{color:var(--stat3-num)}
.stat b{font:var(--stat-font)}
.daypick{background:var(--hero-bg);border:0;border-radius:28px;box-shadow:var(--clay);padding:18px;--muted:var(--hero-muted);--line:var(--hero-line);--surface-2:var(--hero-step)}
.daypick .chips{margin:0 -18px;padding-inline:18px}
/* workout */
.wx.open{background:var(--hero-bg);border-color:var(--open-line);box-shadow:var(--clay);--muted:var(--hero-muted);--line:var(--hero-line);--surface-2:var(--hero-step)}
.wx-n{width:34px;height:34px;border-radius:12px;font:700 14px var(--f-num)}
.wx.open .wx-n{background:var(--open-n-bg);color:var(--open-n-ink)}
.wx.done .wx-n{background:var(--good);color:var(--good-ink)}
.wx-t b,.day-t b,.opt b{font-weight:var(--w-strong)}
.coach{border-radius:16px;padding:10px 13px}
.coach.up{background:var(--tip-bg);color:var(--tip-ink)}
.set{grid-template-columns:22px 1fr 1fr 48px}
.step{height:48px;border-radius:16px;border-color:transparent}
.step button{color:var(--ink)}
.step input{font:var(--step-font)}
.check{width:48px;height:48px;border-radius:16px;border:2px dashed color-mix(in srgb,var(--muted) 60%,transparent);background:transparent}
.set.done .check{background:var(--good);border:2px solid var(--good);color:var(--good-ink)}
.set.done .step{background:var(--good-soft)}
.bar{height:8px;border-radius:4px}
.bar i{background:var(--good-strong)}
.clock{font:var(--clock-font)}
.rest{background:var(--rest-bg);color:var(--rest-ink);border-radius:24px;padding:8px 8px 8px 18px;box-shadow:var(--lift),0 0 0 1px var(--card-line)}
.rest .t,.rest.over .t{font:var(--rest-font);color:var(--rest-num);min-width:76px}
.rest .l{opacity:.8}
.rest button{min-height:46px;border-radius:15px;background:var(--rest-btn);color:var(--rest-ink);font-weight:var(--w-strong)}
/* program, catalogue, import */
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--good-strong)}100%{box-shadow:0 0 0 0 transparent}}
.menu .ck,.st.ok{color:var(--good-text)}
.cat-item.added .plus{background:var(--good);color:var(--good-ink)}
/* diary */
.cal-d{border-radius:12px}
.cal-d.has{background:var(--cal-has-bg);color:var(--cal-has-ink)}
.log-d b{font:700 19px var(--f-num)}
.sc{border-radius:10px}
.chart .ln{stroke:var(--chart)}
.chart .ar,.chart .pt,.chart .pt.end{fill:var(--chart)}
/* profile */
.sub{background:var(--sub-bg);color:var(--sub-ink);border:0;box-shadow:var(--clay),0 0 0 1.5px var(--sub-line);border-radius:28px}
.sub b.big{font:var(--h2)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.view{padding-top:12px}}

/* ---------- working version: onboarding, wishes, camera tab, limits, subscription ---------- */
.tabs-in{grid-template-columns:repeat(5,1fr)}
.tab{font-size:10.5px}
.menu button svg,.prow svg.ico{width:20px;height:20px;flex:none;color:var(--muted)}
.menu button.danger svg{color:var(--bad)}
.btn svg{width:18px;height:18px;flex:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* onboarding */
body.onb-mode .tabs,body.onb-mode .top{display:none}
.onb{max-width:var(--col);margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{display:flex;gap:5px}
.brand .mark i{width:22px;height:22px;display:block}
.brand .mark i:nth-child(1){background:var(--blue);border-radius:8px}
.brand .mark i:nth-child(2){background:var(--pink);border-radius:50%}
.brand .mark i:nth-child(3){background:var(--lime);border-radius:8px 8px 8px 22px}
.brand b{font:var(--h1);font-size:20px;letter-spacing:.01em}
.brand .pill{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:var(--w-strong);padding:4px 10px;border-radius:999px;background:var(--good-soft);color:var(--good-text);white-space:nowrap}
.hero-t{font:var(--hero-font);text-transform:var(--hero-case);margin:0;letter-spacing:-.005em;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:16px;line-height:1.45}
.form-card{background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ck-row{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font-size:15px;line-height:1.35}
.ck-row .box{width:24px;height:24px;border-radius:8px;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:-1px}
.ck-row .box svg{width:16px;height:16px}
.ck-row .box[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ck-row span[data-act]{cursor:pointer}
.ck-row .req{color:var(--bad)}
.ck-row a,.linkish{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
:root[data-theme="bento"] .ck-row a,:root[data-theme="bento"] .linkish{color:#1f5b9a}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--tip-bg);color:var(--tip-ink);border-radius:18px;padding:12px 14px;font-size:14.5px;line-height:1.4}
.note svg{width:20px;height:20px;flex:none;margin-top:1px}
.note.blue{background:var(--cam-bg);color:var(--cam-ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.foot-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;margin-top:auto}
.foot-links button{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

/* four ways to start */
.paths{display:flex;flex-direction:column;gap:12px}
.path{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:22px;background:var(--path-bg);color:var(--path-ink);text-align:left;width:100%;border:1px solid var(--card-line);box-shadow:var(--clay)}
.path .pi{width:46px;height:46px;border-radius:14px;background:var(--path-ico-bg);color:var(--path-ico);display:flex;align-items:center;justify-content:center;flex:none}
.path .pi svg{width:24px;height:24px}
.path b{display:block;font:var(--h2);font-size:19px;margin-bottom:2px}
.path span.s{font-size:14.5px;color:var(--muted);line-height:1.35;display:block}
.path.main{background:var(--path1-bg);color:var(--path1-ink);border-color:transparent}
.path.main .pi{background:color-mix(in srgb,var(--path1-ink) 12%,transparent);color:var(--path1-ink)}
.path.main span.s{color:var(--path1-sub)}
.path .tag{display:inline-block;font-size:11.5px;font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin-left:6px;background:color-mix(in srgb,currentColor 14%,transparent);vertical-align:2px}
.privacy{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.privacy svg{width:18px;height:18px;flex:none;margin-top:1px}

/* empty states */
.empty-card{background:var(--hero-bg);border-radius:28px;box-shadow:var(--clay);padding:20px;display:flex;flex-direction:column;gap:12px;--muted:var(--hero-muted)}
.empty-card .row .btn{flex:1}

/* wishes wizard */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
.steps i{height:5px;border-radius:3px;background:var(--line);display:block}
.steps i.on{background:var(--accent)}
.wish{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wish textarea{border:0;outline:none;resize:none;background:transparent;font-size:17px;line-height:1.5;min-height:200px;padding:0;width:100%}
.wish textarea::placeholder{color:color-mix(in srgb,var(--muted) 85%,transparent)}
.wish .row{justify-content:space-between}
.mic{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:var(--w-strong);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--pink);color:var(--pink-ink);border-color:var(--pink);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--pink) 30%,transparent)}}
.found{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:13.5px;font-weight:var(--w-strong);padding:5px 11px;border-radius:999px;background:var(--surface);color:var(--muted);border:1px dashed color-mix(in srgb,var(--muted) 60%,transparent)}
.fchip.ok{background:var(--good-soft);color:var(--good-text);border:1px solid transparent}
.frm{display:flex;flex-direction:column;gap:12px}
.fld{background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fld>label,.fld .lab{font-size:12.5px;font-weight:var(--w-strong);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld .seg{background:var(--surface-2)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums .input{text-align:center;font:var(--step-font);font-size:18px;min-height:48px}
.nums span{display:block;font-size:12px;color:var(--muted);text-align:center;margin-top:3px}
.focus-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.focus-row .nm{flex:1;min-width:0;font-weight:var(--w-strong)}
.lvl{display:flex;gap:4px}
.lvl button{min-height:34px;padding:0 9px;border-radius:10px;font-size:13px;font-weight:var(--w-strong);color:var(--muted);background:var(--surface-2)}
.lvl button[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-ink)}
.focus-row .x{width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:16px}
.addchips{display:flex;flex-wrap:wrap;gap:6px}
.addchips button{min-height:34px;padding:0 12px;border-radius:999px;border:1px dashed color-mix(in srgb,var(--muted) 60%,transparent);font-size:13.5px;font-weight:var(--w-strong);color:var(--muted)}
.lim-chips{display:flex;flex-wrap:wrap;gap:8px}
.lim-chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:var(--w-strong);font-size:14px}
.lim-chips button[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.loadbar{display:flex;height:14px;gap:2px;border-radius:5px;overflow:hidden}
.loadbar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:13.5px}
.legend span{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.pday{background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:22px;overflow:hidden}
.pday-h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.pday-h b{display:block;font-weight:var(--w-strong);font-size:16px}
.pday-h span.hint{display:block}
.pday-l{border-top:1px solid var(--line)}
.pday-l div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14.5px}
.pday-l div:first-child{border-top:0}
.pday-l div span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.why{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.why li::marker{color:var(--accent)}

/* camera tab */
.camcard{background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.camcard .hd{display:flex;gap:12px;align-items:center}
.camcard .pi{width:44px;height:44px;border-radius:14px;background:var(--cam-bg);color:var(--cam-ink);display:flex;align-items:center;justify-content:center;flex:none}
.camcard .pi svg{width:24px;height:24px}
.camcard .hd b{display:block;font:var(--h2);font-size:19px}
.camcard .hd span{font-size:14px;color:var(--muted)}
.pickbtn{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px 8px 14px;border-radius:16px;background:var(--surface-2);text-align:left;width:100%}
.pickbtn span.grow b{display:block;font-weight:var(--w-strong)}
.pickbtn span.grow small{color:var(--muted);font-size:13px}
.pickbtn svg{width:20px;height:20px;color:var(--muted);flex:none}
.vlog{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:22px;overflow:hidden}
.vrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.vrow:first-child{border-top:0}
.vrow b{display:block;font-weight:var(--w-strong)}
.vrow small{color:var(--muted);font-size:13px}
.q{font-size:12.5px;font-weight:var(--w-strong);border-radius:999px;padding:3px 9px;white-space:nowrap}
.q.good{background:var(--good-soft);color:var(--good-text)}
.q.fair{background:var(--warn-soft);color:var(--warn)}
.q.bad{background:var(--bad-soft);color:var(--bad)}
.stripe{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.stripe i{height:12px;border-radius:3px;background:var(--good-strong);display:block}
.stripe i.w{background:var(--warn)}
.stripe i.b{background:var(--bad)}
.fault{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fault:first-child{border-top:0}
.fault .n{font-size:12px;font-weight:var(--w-strong);border-radius:6px;padding:2px 7px;height:fit-content;white-space:nowrap;background:var(--bad-soft);color:var(--bad)}
.fault b{display:block}
.fault span.hint{display:block}

/* profile: limits, theme, storage */
.lim{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--card-shadow);border-radius:24px;padding:14px 16px}
.lim-r{display:flex;flex-direction:column;gap:6px}
.lim-r .row{justify-content:space-between;font-size:14.5px}
.lim-r .row b{font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:4px}
.meter i.full{background:var(--warn)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid transparent;box-shadow:var(--card-shadow)}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th .mini{border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;height:92px}
.th .mini i{display:block;border-radius:6px;height:10px}
.th b{font-weight:var(--w-strong);font-size:15px;display:flex;align-items:center;gap:6px}
.th small{color:var(--muted);font-size:12.5px}
.th.dusk{background:#1c2131;color:#f3efe7}
.th.dusk small{color:#a9acbc}
.th.dusk .mini{background:#12151f}
.th.bento{background:#fff8ef;color:#262838}
.th.bento small{color:#5d5a63}
.th.bento .mini{background:#f1e8dc}
.prow .val{color:var(--muted);font-size:14px;text-align:right;max-width:55%}

/* subscription */
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font:var(--stat-font);font-size:34px;line-height:1}
.feat{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat li i{width:22px;height:22px;border-radius:50%;background:var(--good);color:var(--good-ink);display:flex;align-items:center;justify-content:center;flex:none}
.feat li i svg{width:13px;height:13px}
.feat li.soon{color:var(--muted)}
.feat li.soon i{background:var(--surface-2);color:var(--muted)}
.addon{background:var(--sub-bg);color:var(--sub-ink);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 1.5px var(--sub-line)}
.addon .hint{color:inherit;opacity:.85}
.switch{width:52px;height:32px;border-radius:999px;background:var(--line);padding:3px;display:flex;align-items:center;flex:none;transition:background .15s}
.switch i{width:26px;height:26px;border-radius:50%;background:var(--surface);display:block;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(20px)}

/* documents */
.doc{font-size:14.5px;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.doc h3{font-weight:var(--w-strong);font-size:15.5px;margin-top:8px}
.doc p,.doc ul{margin:0}
.doc ul{padding-left:18px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc td,.doc th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.doc .meta{color:var(--muted);font-size:13px}

/* OCR progress */
.ocr-row{display:flex;align-items:center;gap:10px;font-size:14px}
.ocr-row .meter{flex:1}

/* fixes after the phone-width check */
[hidden]{display:none!important}
.ck-row .linkish{display:inline;text-align:inherit;font:inherit;line-height:inherit;padding:0;vertical-align:baseline}
.toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.toolbar .btn{padding-inline:8px;min-width:0;gap:6px}
.set .step{grid-template-columns:30px 1fr 30px}
.set .step input{font-size:19px}
.camcard .hd>span{color:inherit;min-width:0}
.camcard .hd span span{display:block}
.sets-n{display:flex;align-items:center;flex:1.5;min-width:148px;height:48px;border-radius:var(--r-btn);background:var(--surface-2);font-weight:var(--w-strong)}
.sets-n span{flex:1;text-align:center;font-size:14.5px;white-space:nowrap}
.sets-n button{width:42px;height:100%;font-size:22px;line-height:1;color:var(--ink);border-radius:var(--r-btn)}
.sets-n button:active{background:var(--line)}
.sets-n button[disabled]{opacity:.3}
.wx-a{flex-wrap:nowrap}
.wx-a .btn{min-width:0;padding-inline:12px}
/* subscription rows (as on the prototype) */
.sub .price b{font:var(--stat-font);font-size:30px;line-height:1}
.lims{display:flex;flex-direction:column;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.lims .lim{display:flex;flex-direction:row;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid color-mix(in srgb,currentColor 10%,transparent);background:none;border-radius:0;box-shadow:none;border-left:0;border-right:0;border-top:0}
.lims .lim:last-child{border-bottom:0}
.lims .lim small{font-size:14px;font-weight:var(--w-strong);text-align:right;font-variant-numeric:tabular-nums}

/* supersets */
.ss-h{font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.01em;margin:10px 4px 4px;display:flex;align-items:center;gap:6px}
.ss-h::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--accent)}
.ex.ss{border-left:3px solid var(--accent);margin-left:2px}
.ex.ss:not(.ss-last){margin-bottom:0}
.ssl{display:inline-block;min-width:24px;margin-right:6px;padding:0 5px;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-size:12px;line-height:18px;text-align:center;vertical-align:1px}
.wx.ss{border-left:3px solid var(--accent)}

/* support card in the profile */
.help-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);font:inherit}
.help-card .hc-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);flex:none}
.help-card .hc-ico svg{width:22px;height:22px}
.help-card>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:2px}
.help-card small{color:var(--muted);font-size:13.5px;line-height:1.35}

/* Small phones, keyboard access, and clear feedback in both themes. */
.view>*{min-width:0}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis,.statline{grid-template-columns:repeat(3,minmax(0,1fr))}
.set{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 48px}
.step input{width:100%;min-width:0}
.plan-list .nm{min-width:0;overflow-wrap:anywhere}
.plan-list .ds{flex:none;text-align:right}
.daypick .btn.primary{margin-block:2px 4px}
.seg button{min-width:0;padding:5px 4px;line-height:1.25}
.sheet-h,.sheet-f{flex-shrink:0}
.sheet-b{overscroll-behavior:contain;scrollbar-gutter:stable}
body.sheet-open{overflow:hidden}
.input[aria-invalid="true"],.step input[aria-invalid="true"]{outline:2px solid var(--bad);outline-offset:-2px}
.demo-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--cam-bg);color:var(--cam-ink);border-radius:18px;font-size:14px;line-height:1.35}
.demo-banner span{flex:1;min-width:0}
.demo-banner b{display:block}
.demo-banner button{min-height:44px;padding:6px 12px;border:1px solid currentColor;border-radius:12px;flex:none;font-weight:var(--w-strong)}
.rest .l{min-width:0;line-height:1.25}
.rest button{flex:none}
.toast{pointer-events:none}
.toast button{pointer-events:auto}
.ck-row .box{position:relative}
.ck-row .box::before{content:"";position:absolute;inset:-10px}
.cal-d[disabled]{cursor:default;color:var(--muted)}
.empty .btn{margin-top:14px}
@media (max-width:360px){
  .fld .seg:has([data-v^="goal:"]){grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
  .set{grid-template-columns:16px minmax(0,1fr) minmax(0,1fr) 44px;gap:5px}
  .set .step{grid-template-columns:24px minmax(0,1fr) 24px}
  .set .step input{font-size:17px}
  .check{width:44px;height:48px}
  .wx-b{padding-inline:10px}
  .rest{gap:6px;padding-left:12px}
  .rest .t{min-width:62px;font-size:26px}
  .rest button{padding-inline:8px}
  .stat b{font-size:18px}
  :root[data-theme="bento"] .stat b{font-size:14px}
  .path{padding:14px;gap:10px}
  .path b{font-size:17px}
  .brand{gap:8px;flex-wrap:wrap}
  .brand .pill{font-size:11px}
}
@media (hover:hover){
  .btn:not(:disabled):hover,.path:hover,.pickbtn:hover{filter:brightness(.94)}
  .tab:not([aria-current]):hover{background:var(--surface-2);color:var(--ink)}
}

/* ---------- supersets: neighbours with the same ss are done in turn — 1А → 1Б (→ 1В) → 1А …, rest after the round ---------- */
const SS_LETTERS = 'АБВГ', SS_MAX = 4;
function normSS(items) {
  const seen = new Set(); let prevOld = null, cur = null;
  for (const it of items) {
    if (!it.ss) { prevOld = null; continue; }
    if (it.ss !== prevOld) { prevOld = it.ss; cur = seen.has(it.ss) ? nid('g') : it.ss; seen.add(cur); }
    it.ss = cur;
  }
  for (let i = 0; i < items.length; i++) { const g = items[i].ss; if (g && !((items[i - 1] && items[i - 1].ss === g) || (items[i + 1] && items[i + 1].ss === g))) delete items[i].ss; }
}
function blockLabels(items) {   // '1', '2', '3А', '3Б', '4'
  const out = []; let n = 0, k = 0, prev = null;
  for (const it of items) { if (it.ss && it.ss === prev) k++; else { n++; k = 0; } prev = it.ss || null; out.push(it.ss ? n + SS_LETTERS[k] : String(n)); }
  return out;
}
function groupOf(items, i) {
  const g = items[i] && items[i].ss; if (!g) return [i];
  let a = i, b = i;
  while (a > 0 && items[a - 1].ss === g) a--;
  while (b < items.length - 1 && items[b + 1].ss === g) b++;
  return Array.from({length: b - a + 1}, (_, x) => a + x);
}

    if (!item._reps) item._needsDose = true;
  };

    if (raw === PHOTO_BREAK) { tracker.nextPhoto(); continue; }
    const line = fixOcr(String(raw || '').trim()); if (!line) continue;
    if (coachNote(line)) { if (buf.length) openCard(); tracker.note(line, item); continue; }
    if (/^\s*(?:№\s*)?\d{1,2}[.)]?\s*$/.test(line)) { if (buf.length) openCard(); ordinal = +line.replace(/\D/g, ''); continue; }
    const wm = line.match(W_ROW), rm = line.match(R_ROW);
    if (wm || rm) {

        if (wm) { const w = cardWeight(wm[2]); if (w) { item.w = w; item.inc = guessInc(item.name, item.base, true, item.sec); } item._wn = Math.max(item._wn || 0, groupsOf(wm[2]).length); }
        else { const d = cardReps(rm[2]); if (d) { let [s, lo, hi] = d; if (groupsOf(rm[2]).length < 2 && (item._wn || 0) >= 2 && !parseDose(rm[2])) s = Math.max(s, item._wn); item.s = item._reps ? Math.max(s, item.s) : s; item.lo = lo; item.hi = hi; item._reps = true; delete item._needsDose; } }

    const head = line.match(DAY_HEAD);
    if (head && line.length <= 60 && !matchEx(line.slice(head[0].length), .9)[0]) {
      if (buf.length) openCard();
      const previous = tracker.current;
      const day = tracker.header(dayTitle(line, days.length + 1));
      if (day !== previous) item = null;
      ordinal = null; continue;
    }
    if (groupHeading(line)) { if (buf.length) openCard(); tracker.header(dayTitle(line, days.length + 1)); item = null; ordinal = null; continue; }
    const inlineDose = parseDose(line);
    if (inlineDose) {
      if (buf.length) openCard();
      const parsed = parseList([line], {notes: [], warnings: []});
      if (parsed[0] && parsed[0].items[0]) { item = tracker.add(parsed[0].items[0], importOrdinal(line) || ordinal); ordinal = null; continue; }
    }
    const number = importOrdinal(line) || ordinal;
    const last = buf[buf.length - 1] || '';

    else { if (buf.length) openCard(); buf = [line]; bufNumber = number; bufPhoto = tracker.photo; }
    ordinal = null;
  }
  if (buf.length) openCard();
  for (const d of days) for (const it of d.items) { delete it._reps; delete it._wn; }
  return days.filter(x => x.items.length);
}

/* ---------- OCR on the phone (Tesseract, Russian + English). Files next to the app when installed; CDN otherwise ---------- */
let OCR = null, OCR_LOG = null;   // the worker keeps one logger; each import points it at its own progress bar
const OCR_CDN = {lib: 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js', worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/worker.min.js', core: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@6.0.0'};
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function ocrWorker(onMsg) {
  if (onMsg) OCR_LOG = onMsg;
  if (OCR) return OCR;
  const local = location.protocol.startsWith('http') && SAME_SITE;
  const base = new URL('vendor/tesseract/', location.href).href;
  if (!window.Tesseract) {
    try { if (!local) throw 0; await loadScript(base + 'tesseract.min.js'); } catch (e) { await loadScript(OCR_CDN.lib); }
  }
  const opts = window.Tesseract && local
    ? {workerPath: base + 'worker.min.js', corePath: base + 'core/', langPath: base + 'lang', workerBlobURL: false, logger: m => { if (OCR_LOG) OCR_LOG(m); }}
    : {workerPath: OCR_CDN.worker, corePath: OCR_CDN.core, logger: m => { if (OCR_LOG) OCR_LOG(m); }};
  OCR = await window.Tesseract.createWorker(['rus', 'eng'], 1, opts);
  return OCR;
}
/* dark screenshots read badly: grey, invert if the picture is mostly dark, upscale small ones */
function prepImage(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = img.width < 1100 ? 2 : 1, c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      const d = g.getImageData(0, 0, c.width, c.height), p = d.data; let sum = 0;
      for (let i = 0; i < p.length; i += 4) { const v = .299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]; p[i] = p[i + 1] = p[i + 2] = v; sum += v; }
      if (sum / (p.length / 4) < 110) for (let i = 0; i < p.length; i += 4) p[i] = p[i + 1] = p[i + 2] = 255 - p[i];
      g.putImageData(d, 0, 0); res(c);
    };
    img.onerror = rej; img.src = url;
  });
}
/* keep wide gaps between words — the card and «name    6-8» rules rely on them */
function linesOf(data) {
  const out = [];
  for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || []) {
    const ws = (l.words || []).filter(w => w.text && w.text.trim()); let s = '', prev = null;
    for (const w of ws) { if (prev) { const cw = (prev.bbox.x1 - prev.bbox.x0) / Math.max(1, prev.text.length); s += (w.bbox.x0 - prev.bbox.x1) > cw * 1.8 ? '   ' : ' '; } s += w.text; prev = w; }
    if (s.trim()) out.push(s.trim());
  }
  if (!out.length && data.text) out.push(...data.text.split('\n').map(x => x.trim()).filter(Boolean));
  return out;
}
async function ocrPhotos(photos, progress) {
  const all = [];
  const w = await ocrWorker(m => { if (m.status === 'recognizing text') progress && progress(null, m.progress); });
  for (let i = 0; i < photos.length; i++) {
    progress && progress(i, 0);
    const canvas = await prepImage(photos[i].url);
    const r = await w.recognize(canvas, {}, {blocks: true, text: true});
    if (i) all.push(PHOTO_BREAK);
    all.push(...linesOf(r.data));
  }
  return all;
}

/* drag & drop: days and exercises (also between days) */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (!h || e.button > 0) return;
  e.preventDefault();
  const kind = h.dataset.drag;
  if (kind === 'day') $$('#days .day').forEach(x => x.classList.add('compact'));
  const el = h.closest(kind === 'day' ? '.day' : '.ex'), r = el.getBoundingClientRect(), ghost = el.cloneNode(true);
  ghost.classList.add('drag-ghost'); ghost.classList.remove('flash');
  Object.assign(ghost.style, {width: r.width + 'px', left: r.left + 'px', top: r.top + 'px'});
  document.body.appendChild(ghost); el.classList.add('placeholder');
  drag = {kind, el, ghost, dy: e.clientY - r.top, x: r.left + r.width / 2, y: e.clientY, from: el.closest('.day').dataset.day, moved: false};
  snap(); requestAnimationFrame(autoScroll);
});
document.addEventListener('pointermove', e => { if (!drag) return; e.preventDefault(); drag.y = e.clientY; drag.moved = true; dragTo(); }, {passive: false});
function dragTo() {
  const {ghost, kind, el} = drag;
  ghost.style.top = (drag.y - drag.dy) + 'px';
  $$('.day.drop').forEach(x => x.classList.remove('drop'));
  if (kind === 'day') {
    const list = $('#days'), cards = $$('#days .day').filter(c => c !== el);
    const before = cards.find(c => { const r = c.getBoundingClientRect(); return drag.y < r.top + r.height / 2; }) || null;
    if (el.nextSibling !== before) list.insertBefore(el, before);
    return;
  }
  const under = document.elementFromPoint(drag.x, drag.y), dayEl = under && under.closest('.day');
  if (!dayEl) return;
  const list = $('.ex-list', dayEl);
  if (dayEl.classList.contains('closed')) { dayEl.classList.add('drop'); if (el.parentNode !== list) list.appendChild(el); return; }
  const rows = $$('.ex', list).filter(c => c !== el);
  const before = rows.find(c => { const r = c.getBoundingClientRect(); return drag.y < r.top + r.height / 2; }) || null;
  if (el.parentNode !== list || el.nextSibling !== before) list.insertBefore(el, before);
  $$('.hint', list).forEach(x => x.remove());
}
function autoScroll() {
  if (!drag) return;
  const edge = 90, vh = innerHeight;
  if (drag.y < edge) { scrollBy(0, -Math.ceil((edge - drag.y) / 6)); dragTo(); }
  else if (drag.y > vh - edge - 64) { scrollBy(0, Math.ceil((drag.y - (vh - edge - 64)) / 6)); dragTo(); }
  requestAnimationFrame(autoScroll);
}
function endDrag() {
  if (!drag) return;
  const {kind, el, ghost, from} = drag;
  ghost.remove(); el.classList.remove('placeholder');
  const moved = drag.moved; drag = null;
  if (!moved) { render(); return; }
  if (kind === 'day') {
    const order = $$('#days .day').map(x => x.dataset.day), before = S.program.days.map(d => d.id).join();
    S.program.days.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    renumber(); render();
    if (before !== order.join()) toast('Порядок дней изменён', true);
    return;
  }
  const byId = {};
  S.program.days.forEach(d => d.items.forEach(it => { byId[it.id] = it; }));
  $$('#days .day').forEach(dEl => { const d = dayById(dEl.dataset.day); d.items = $$('.ex', dEl).map(x => byId[x.dataset.item]).filter(Boolean); });
  const to = el.closest('.day').dataset.day;

}

    snap(); delete it.ss;
    if (idx !== G[0] && idx !== G[G.length - 1]) { day.items.splice(idx, 1); day.items.splice(G[G.length - 1], 0, it); }
    closeSheet(); render(); toast(`«${it.name}» — отдельно, по порядку`, true);
  },
  'ex-moveto': v => { const [d, i, to] = v.split(':'), [day, idx, it] = findItem(d, i); snap(); day.items.splice(idx, 1); delete it.ss; dayById(to).items.push(it); closeSheet(); S.open[to] = true; render(); toast(`Перенесла в «${dayById(to).title}»`, true); },
  'ex-swap': v => { const [d, i] = v.split(':'); closeSheet(); catSheet('swap', d, i); },
  'dz-adj': v => { const [k, d] = v.split(':'), inp = $('#dz-' + k); let n = parseNum(inp.value) + parseFloat(d); n = Math.max(k === 's' ? 1 : 0, Math.round(n * 10) / 10); inp.value = k === 'w' ? fmt(n) : n; },
  'dz-rest': v => { $('#sheets').dataset.rest = v; $$('#dz-rest button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); },
  'dz-save': v => {
    const [d, i] = v.split(':'), [, , it] = findItem(d, i);
    const s = inputNumber($('#dz-s'), 1, true), w = inputNumber($('#dz-w'));
    const lo = inputNumber($('#dz-lo'), 1, true), hi = inputNumber($('#dz-hi'), 1, true);
    if ([s, w, lo, hi].some(n => n === null)) return toast('Укажи вес от 0, подходы и повторы или секунды — целыми числами больше 0');
    snap();
    it.s = s; it.w = w;
    it.lo = Math.max(1, Math.min(lo, hi)); it.hi = Math.max(lo, hi, 1); it.rest = +$('#sheets').dataset.rest || 90;
    closeSheet(); render(); toast('Сохранено', true);
  },
  cat: v => catSheet('add', v),
  'cat-g': v => { S.cat.g = v; $$('#cat-g .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === v)); catList(); },
  'cat-add': (v, el) => catAdd(v, false, el),
  'cat-own': (v, el) => catAdd(null, true, el),

  /* own program by photo or text */
  import: () => importSheet(),
  'program-organize': () => organizeProgram(),
  'imp-new': () => { delete S.importDraft; save(); IMP = newImportSession(); renderImport(); scrollSheet(); },
  'imp-undo': () => { const previous = IMP.undo.pop(); if (!previous) return; Object.assign(IMP, JSON.parse(previous)); renderImport(); },
  'imp-confirm-days': () => { if (importDayCount() && IMP.days.length === importDayCount()) { IMP.countConfirmed = importDayCount(); renderImport(); } },
  'imp-day-add': () => { snapImport(); IMP.days.push({id: nid('r'), title: `День ${IMP.days.length + 1}`, items: [], _reason: 'День добавлен вручную'}); renderImport(); },
  'imp-day-delete': v => { const index = +v; if (IMP.days[index].items.length) return; snapImport(); IMP.days.splice(index, 1); renderImport(); },
  'imp-photo-move': v => { const [index, direction] = v.split(':').map(Number), target = index + direction; if (target < 0 || target >= IMP.photos.length) return; [IMP.photos[index], IMP.photos[target]] = [IMP.photos[target], IMP.photos[index]]; renderImport(); },
  'imp-mode': v => { IMP.mode = v; IMP.sample = false; renderImport(); },
  'imp-rm': v => { const photo = IMP.photos.splice(+v, 1)[0]; if (photo && photo.url) URL.revokeObjectURL(photo.url); if (!IMP.photos.length) IMP.sample = false; renderImport(); },
  'imp-sample': () => { IMP.mode = 'photo'; IMP.sample = true; IMP.photos = [{url: '', name: 'Скриншот 1'}, {url: '', name: 'Скриншот 2'}]; renderImport(); },
  'imp-read': () => readImport(),
  'imp-back': () => { IMP.step = 'pick'; renderImport(); scrollSheet(); },
  'imp-totext': () => {
    closeTop(); if (!IMP) return;
    IMP.mode = 'text'; IMP.step = 'pick'; IMP.sample = false;
    if (IMP.lines && IMP.lines.length && !IMP.text.trim()) IMP.text = IMP.lines.filter(l => l !== PHOTO_BREAK).join('\n');
    renderImport();
  },
  'imp-dest': v => { IMP.dest = v; renderImport(); },
  'imp-merge': v => { const i = +v, a = IMP.days; if (i <= 0 || i >= a.length) return; snapImport(); a[i - 1].items.push(...a[i].items); a[i - 1].coachNotes = [...(a[i - 1].coachNotes || []), ...(a[i].coachNotes || [])]; a.splice(i, 1); renderImport(); toast('Дни объединены. Правку можно отменить'); },
  'imp-split': v => { const [di, ii] = v.split(':').map(Number); if (!splitImportDay(di, ii)) return; closeImportTools(); renderImport(); toast('Новый день начинается с выбранного упражнения'); },
  'imp-del': v => { const [di, ii] = v.split(':').map(Number); snapImport(); IMP.days[di].items.splice(ii, 1); closeImportTools(); renderImport(); toast('Строка удалена. Правку можно отменить'); },
  'imp-row-menu': v => { const [di, ii] = v.split(':').map(Number); importRowMenu(di, ii); },
  'imp-move-menu': v => { const [di, ii] = v.split(':').map(Number); closeImportTools(); importMoveSheet(di, ii); },
  'imp-move': v => { const [di, ii, target] = v.split(':'); if (!moveImportItem(+di, +ii, target)) return; closeImportTools(); renderImport(); toast('Упражнение перенесено'); },
  'imp-row-shift': v => { const [di, ii, direction] = v.split(':').map(Number), items = IMP.days[di].items, target = ii + direction; if (target < 0 || target >= items.length) return; snapImport(); [items[ii], items[target]] = [items[target], items[ii]]; closeImportTools(); renderImport(); },
  'imp-to-note': v => { const [di, ii] = v.split(':').map(Number); noteImportItem(di, ii); closeImportTools(); renderImport(); toast('Рекомендация сохранится как заметка'); },
  'imp-note-restore': v => { restoreImportNote(v); renderImport(); },
  'imp-add-item': v => fixSheet(+v, null),
  'imp-fix': v => { const [di, ii] = v.split(':').map(Number); closeImportTools(); fixSheet(di, ii); },
  'fx-pick': (v, el) => { IMP.fixPick = v; $$('#fx-menu .ck').forEach(c => { c.hidden = true; }); $('.ck', el).hidden = false; },
  'fx-save': () => {
    const [di, ii] = IMP.fix, name = $('#fx-name').value.trim(), d = parseDose($('#fx-dose').value);
    const w = $('#fx-w').value.trim() ? inputNumber($('#fx-w')) : 0;
    if (name.length < 2) return toast('Напиши название упражнения');
    if (!d) return toast('Укажи подходы и повторы, например 3×8–12 или 3×30 сек');
    if (w === null) return toast('Вес должен быть числом от 0');
    snapImport();
    const it = ii == null ? importItem(name, d, '', w) : IMP.days[di].items[ii];
    const renamed = it.name !== name;
    it.name = name.slice(0, 60); Object.assign(it, {s: d.s, lo: d.lo, hi: d.hi, sec: d.sec, w}); delete it._needsDose;
    const picked = IMP.fixPick !== undefined ? IMP.fixPick : renamed ? resolve(name)[0] || '' : it.base;
    const c = CAT[picked]; it.base = c ? c.k : null; it.cam = !!(c && c.cam); it.inc = guessInc(it.name, it.base, !!w, it.sec);
    it.st = it.base ? 'ok' : 'new';
    if (ii == null) IMP.days[di].items.push(it);
    IMP.fixPick = undefined;
    closeTop(); renderImport();
  },
  'imp-save': () => importSave(),

  /* camera */
  'cam-pick': () => camPickSheet(),
  'cam-set': v => { const it = S.camChoices[+v]; if (it) S.camEx = {name: it.name, base: it.base, w: it.w || (it.sets && it.sets[0] ? it.sets[0].w : 0), inc: it.inc, sec: it.sec, cam: it.cam}; closeSheet(); render(); },
  'cam-cat': () => { closeSheet(); catSheet('cam'); },
  'cam-facing': v => { S.camFacing = v; render(); },
  'cam-go': v => { if (v != null && S.workout) S.workout.active = +v; save(); return 'follow'; },
  vres: v => videoSheet(v),
  'vres-log': v => { const x = S.videoLog.find(y => y.id === v); if (!x) return; const msg = logCamSets(x); closeSheet(); render(); toast(msg); },

  /* diary */
  dtab: v => { S.dtab = v; render(); },
  'cal-m': v => { let [y, m] = S.calM; m += +v; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.calM = [y, m]; render(); },
  'cal-go': v => { const [y, m, d] = v.split('-').map(Number), w = S.diary.find(x => sameDay(x.date, new Date(y, m, d))); if (w) { S.open[w.id] = true; render(); const el = $('#log-' + w.id); el && el.scrollIntoView({behavior: 'smooth', block: 'start'}); } },
  'log-toggle': v => { S.open[v] = !S.open[v]; render(); },
  'set-edit': v => { const [w, e, s] = v.split(':'); setSheet(w, +e, +s); },
  'set-add': v => { const [w, e] = v.split(':'); setSheet(w, +e, null); },
  'se-save': () => {
    const w = inputNumber($('#se-w')), r = inputNumber($('#se-r'), 1, true);
    if (w === null || r === null) return toast('Укажи вес от 0 и целое число повторов или секунд больше 0');
    const {wid, ei, si} = S.setEdit, e = S.diary.find(x => x.id === wid).items[ei], s = {w, r};
    if (si == null) e.sets.push(s); else e.sets[si] = {...e.sets[si], ...s};
    closeSheet(); render(); toast(si == null ? 'Подход добавлен' : 'Сохранено');
  },
  'se-del': () => { const {wid, ei, si} = S.setEdit, w = S.diary.find(x => x.id === wid), e = w.items[ei]; e.sets.splice(si, 1); if (!e.sets.length) w.items.splice(ei, 1); if (!w.items.length) S.diary.splice(S.diary.indexOf(w), 1); closeSheet(); render(); toast('Подход удалён'); },
  'prog-ex': v => { S.prog = v; render(); },

  /* profile, subscription, data */
  theme: v => { S.theme = v; render(); toast(v === 'bento' ? 'Оформление «Бенто»' : 'Оформление «Сумерки»'); },
  paywall: v => paywallSheet(v === 'cam' ? 'Камера-тренер и разбор видео — в подписке.' : ''),
  promo: () => { paywallSheet(); setTimeout(() => { const i = $('#promo'); i && i.focus(); }, 60); },
  'promo-go': () => {
    const i = $('#promo'), c = (i ? i.value : '').trim().toUpperCase();
    if (!c) return toast('Введи промокод');
    const p = PROMOS[c];
    if (!p) return toast('Такого промокода нет — проверь написание');
    if (S.sub.promo !== c) { S.sub.promo = c; S.sub.since = Date.now(); }
    save(); closeTop(); paywallSheet(); render(); if (S.wiz) renderWizard();
    toast(`Промокод принят: ${p.text}`);
  },
  subscribe: () => toast(PRICING.payments ? '' : access().test ? 'Сейчас тестирование: всё уже открыто бесплатно' : 'На время теста оплата отключена — введи промокод TEST2026'),
  'ai-plus': () => {
    S.sub.plusPick = !S.sub.plusPick; save();
    $$('[data-act="ai-plus"]').forEach(b => b.setAttribute('aria-checked', S.sub.plusPick));
    $$('[data-act="subscribe"]').forEach(b => { b.textContent = `Оформить за ${rub(PRICING.sub.price + (S.sub.plusPick ? PRICING.aiPlus.price : 0))}`; });
    toast(S.sub.plusPick ? `С ИИ+ — ${rub(PRICING.sub.price + PRICING.aiPlus.price)} в месяц` : `Без ИИ+ — ${rub(PRICING.sub.price)} в месяц`);
  },
  'ai-once': () => toast(access().level === 'sub' && !access().test ? 'Оплата пока отключена' : 'Разовый пакет добавляется к оформленной подписке; на время теста оплата отключена'),
  backup: () => backupFile(),
  'bk-copy': async () => { const t = $('#bk-text'); try { await navigator.clipboard.writeText(t.value); toast('Скопировано'); } catch (e) { t.focus(); t.select(); toast('Выдели текст и скопируй вручную'); } },
  restore: () => restoreSheet(),
  support: () => supportSheet(),
  'sup-diag': () => { S.supDiag = S.supDiag === false; const b = $('[data-act="sup-diag"].box'); if (b) b.setAttribute('aria-checked', String(S.supDiag !== false)); },
  'sup-send': (v, el, e) => {
    const t = (($('#sup-text') || {}).value || '').trim();
    if (t.length < 3) { if (e) e.preventDefault(); toast('Напиши пару слов — что случилось'); const x = $('#sup-text'); x && x.focus(); return; }
    const text = supportText(); S.supDraft = t;
    try { navigator.clipboard.writeText(text).then(() => toast('Текст скопирован — вставь его в чат с ботом'), () => {}); } catch (err) { /* the bot asks anyway */ }
    return 'follow';
  },
  'rs-text': () => { const t = ($('#rs-text') || {}).value || ''; if (!t.trim()) return toast('Вставь текст копии или выбери файл'); restoreText(t.trim()); },
  'restore-go': () => {
    const d = RESTORE; if (!d) return;
    for (const k of BACKUP_KEYS) if (k in d && d[k] != null) S[k] = d[k];
    S.workout = null; S.rest = null; S.pick = null; S.open = {}; S.stage = S.user ? 'app' : S.stage; S.tab = 'today'; S.demo = false; delete S.demoReturn;
    RESTORE = null; closeSheet(); render(); window.scrollTo({top: 0}); toast('Данные восстановлены из копии');
  },
  wipe: () => sheet('Удалить все данные?', `<p style="margin:0">С этого телефона удалятся программа, дневник, разборы камеры, пожелания и аккаунт с отметками согласия. Вернуть их можно будет только из сохранённой копии.</p>`,
    `<button class="btn" data-act="close">Отмена</button><button class="btn danger" data-act="wipe-go">Удалить всё</button>`),
  'wipe-go': () => {
    try { localStorage.removeItem(KEY); localStorage.removeItem(INBOX); } catch (e) { /* nothing stored */ }
    S = fresh(); S.renaming = null; S.wiz = null; REG = {pd: false, terms: false, news: false, email: ''};
    closeSheet(); render(); window.scrollTo({top: 0}); toast('Все данные удалены с этого телефона');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const f = A[el.dataset.act];
  if (!f) return;
  const r = f(el.dataset.v, el, e);
  if (r !== 'follow') e.preventDefault();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in && S.workout) {
    const [i, k] = t.dataset.v.split(':').map(Number), it = S.workout.items[i], s = it.sets[k], f = t.dataset.in;
    const value = inputNumber(t, f === 'r' ? 1 : 0, f === 'r');
    if (value !== null) {
      s[f] = value;
      if (f === 'w' && !s.done) it.sets.forEach((o, j) => {
        if (j > k && !o.done) {
          o.w = value;
          const input = $(`[data-in="w"][data-v="${i}:${j}"]`);
          if (input) { input.value = fmt(value); input.setAttribute('aria-invalid', 'false'); }
        }
      });
      save();
    }
  }
  if (t.id === 'reg-email') REG.email = t.value;
  if (t.id === 'reg-promo') REG.promo = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'restore-file' && t.files && t.files[0]) { restoreFile(t.files[0]); t.value = ''; }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.id === 'rename') { const d = dayById(t.dataset.day); if (d) d.title = t.value.trim() || d.title; S.renaming = null; setTimeout(render, 0); }
});
document.addEventListener('keydown', e => {
  const id = e.target.id;
  if (e.key === 'Tab' && sheetTop()) {
    const dialog = $('[role="dialog"]', sheetTop()), focusable = $$('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]', dialog).filter(el => el.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (!first) { e.preventDefault(); dialog.focus(); }
    else if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || document.activeElement === dialog)) { e.preventDefault(); first.focus(); }
  }
  if (e.key === 'Enter' && id === 'rename') e.target.blur();
  if (e.key === 'Enter' && id === 'reg-email') A['reg-go']();
  if (e.key === 'Enter' && id === 'promo') A['promo-go']();
  if (e.key === 'Escape' && $('#sheets').children.length) closeTop();
});

/* results from the camera: on start, when coming back to this tab, and when another tab writes them */
window.addEventListener('pageshow', processInbox);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') processInbox(); });
window.addEventListener('focus', processInbox);
window.addEventListener('storage', e => { if (e.key === INBOX && e.newValue) processInbox(); else if (e.key === KEY && e.newValue && !S.workout) { S = load(); render(); } });

/* inside Telegram: use its frame */
if (/tgWebApp/.test(location.hash) || window.TelegramWebviewProxy) {
  loadScript('https://telegram.org/js/telegram-web-app.js').then(() => { try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) { /* old client */ } applyTheme(); }).catch(() => {});
}
if (location.hash === '#from-camera') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } }
if (S.stage !== 'welcome' && !S.user && !S.demo) S.stage = 'welcome';
render();
processInbox();

</script>
</body>
</html>
