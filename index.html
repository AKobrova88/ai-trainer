<style>
/* One screen, one job: the exercise, a looping example, the camera with live cues, and the list of sets to save. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#131a22; --muted:#5b6673; --line:#d8dee5;
  --accent:#1d58d6; --accent-ink:#ffffff; --accent-soft:#e2eafc;
  --good:#16834a; --good-soft:#dff3e7; --warn:#a96400; --warn-soft:#fbeed6; --bad:#c3352a; --bad-soft:#fbe4e1;
  --stage:#0c1117; --stage-2:#121a22; --stage-ink:#e9eef3; --stage-dim:#8d99a6; --stage-glass:rgba(10,15,21,.72); --stage-edge:rgba(233,238,243,.14);
  --stage-accent:#7aa2ff; --stage-good:#3fd28e; --stage-warn:#ffb648; --stage-bad:#ff5f52;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e12; --surface:#121920; --surface-2:#18212a; --ink:#e5eaef; --muted:#95a1ae; --line:#25303b;
    --accent:#77a0ff; --accent-ink:#0a1222; --accent-soft:#18253d;
    --good:#43c983; --good-soft:#11301f; --warn:#f0aa3c; --warn-soft:#33260f; --bad:#ff6c60; --bad-soft:#3a1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e12; --surface:#121920; --surface-2:#18212a; --ink:#e5eaef; --muted:#95a1ae; --line:#25303b;
  --accent:#77a0ff; --accent-ink:#0a1222; --accent-soft:#18253d;
  --good:#43c983; --good-soft:#11301f; --warn:#f0aa3c; --warn-soft:#33260f; --bad:#ff6c60; --bad-soft:#3a1714;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;margin:0}
button,input,select{font:inherit;color:inherit}

.app{max-width:560px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.ex{flex:1;min-width:0;position:relative}
.ex label{display:block;font:600 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}

.sets{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sets h2{margin:0 0 8px;font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sets ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.set{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2)}
.set-n{font:700 15px/1 var(--f-mono);color:var(--muted);text-align:center}
.set-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14.5px}
.set-main input{width:62px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 7px;font:600 15px var(--f-mono);text-align:center}
.set-main input.r{width:52px}
.set-q{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-right:4px;white-space:nowrap}
.set-q.good{background:var(--good-soft);color:var(--good)} .set-q.fair{background:var(--warn-soft);color:var(--warn)} .set-q.bad{background:var(--bad-soft);color:var(--bad)} .set-q.none{background:var(--surface);color:var(--muted)}
.set-note{grid-column:2/-1;margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.set-del{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:4px 6px}
.send{margin-top:12px;display:grid;gap:8px}
.send p{margin:0;color:var(--muted);font-size:13px}
.send .main-btn{min-height:50px;font-size:15.5px}
.add-set{border:1px dashed var(--line);background:transparent;border-radius:12px;padding:9px;color:var(--muted);font-weight:600;font-size:14px}
.foot{color:var(--muted);font-size:12px;line-height:1.5;margin:4px 2px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>/* Technique analyzers for every exercise: a line-by-line port of trainer/analysis/rules.py and generic.py
   (the Telegram bot), so the phone and the bot judge a set the same way. Exercise specs and fault texts come
   from the bot as one JSON blob (AT.setData). Runs in the browser and in Node (parity tests). */
const AT = (() => {
'use strict';
const DEG = 180 / Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const SIDE = {
  l: { ear: 7, sh: 11, el: 13, wr: 15, hip: 23, kn: 25, an: 27, heel: 29, toe: 31 },
  r: { ear: 8, sh: 12, el: 14, wr: 16, hip: 24, kn: 26, an: 28, heel: 30, toe: 32 }
};
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: ((a.z || 0) + (b.z || 0)) / 2, score: Math.min(a.score, b.score) });
function angle(a, b, c) {
  const ux = a.x - b.x, uy = a.y - b.y, vx = c.x - b.x, vy = c.y - b.y;
  const d = Math.hypot(ux, uy) * Math.hypot(vx, vy) || 1;
  return Math.acos(clamp((ux * vx + uy * vy) / d, -1, 1)) * DEG;
}
const fromVertical = (lower, upper) => Math.atan2(Math.abs(upper.x - lower.x), Math.max(1e-6, lower.y - upper.y)) * DEG;
const LEVEL_TOL = { novice: 1.25, normal: 1.0, pro: 0.8 };
const SQUAT_DEPTH = { half: -0.45, parallel: -0.06, deep: 0.12 };
const PUSH_DEPTH = { half: 118, parallel: 98, deep: 86 };
const J = { shoulder: 'sh', elbow: 'el', wrist: 'wr', hip: 'hip', knee: 'kn', ankle: 'an', heel: 'heel', toe: 'toe', ear: 'ear' };
const ANGLES = { knee: ['hip', 'kn', 'an'], hip: ['sh', 'hip', 'kn'], elbow: ['sh', 'el', 'wr'], shoulder: ['hip', 'sh', 'el'], ankle: ['kn', 'an', 'toe'] };
let D = { faults: {}, specs: {}, squat: {}, pushup: {}, titles: {}, pen: {}, cam: {}, ex: {} };
const sc = p => (p && p.score) || 0;

class BaseAnalyzer {
  constructor(depth = 'parallel', level = 'normal') { this.depth = depth; this.level = level; this.reset(); }
  get tol() { return LEVEL_TOL[this.level] || 1.0; }
  reset() {
    this.reps = []; this.phase = 'setup'; this.status = 'calib'; this.view = null; this.viewRatio = null;
    this.side = 'l'; this.sideScore = { l: 0.5, r: 0.5 }; this.zDiff = 0; this.cal = null; this.standSince = null;
    this.rep = null; this.lock = null; this.hold = {}; this.live = new Set(); this.pulses = {}; this.events = [];
    this.prevT = null; this.velS = null; this.lostSince = null; this.lastRepEnd = null; this.setEnded = false;
    this.now = 0; this.kp = null; this.m = null;
  }
  emit(e) { this.events.push(e); }
  drain() { const e = this.events; this.events = []; return e; }
  tick(t) { const dt = this.prevT == null ? 1 / 30 : clamp(t - this.prevT, 1 / 240, 0.5); this.prevT = t; this.now = t; return dt; }
  updateView(kp) {
    const ls = kp[11], rs = kp[12], lh = kp[23], rh = kp[24];
    const torso = dist(mid(ls, rs), mid(lh, rh)) || 1;
    const span = Math.max(Math.abs(ls.x - rs.x), Math.abs(lh.x - rh.x) * 1.3);
    const r = span / torso;
    this.viewRatio = this.viewRatio == null ? r : lerp(this.viewRatio, r, 0.15);
    const before = this.view;
    if (this.view == null) this.view = this.viewRatio > 0.43 ? 'front' : 'side';
    else if (this.view === 'side' && this.viewRatio > 0.5) this.view = 'front';
    else if (this.view === 'front' && this.viewRatio < 0.36) this.view = 'side';
    return before != null && before !== this.view;
  }
  updateSide(kp, keys) {
    const mean = (s, f) => keys.reduce((a, k) => a + f(kp[SIDE[s][k]]), 0) / keys.length;
    for (const s of ['l', 'r']) this.sideScore[s] = lerp(this.sideScore[s], mean(s, p => p.score || 0), 0.2);
    this.zDiff = lerp(this.zDiff, mean('l', p => p.z || 0) - mean('r', p => p.z || 0), 0.2);
    const gap = this.sideScore.l - this.sideScore.r;
    if (Math.abs(gap) > 0.06) this.side = gap > 0 ? 'l' : 'r';
    else if (Math.abs(this.zDiff) > 4) this.side = this.zDiff < 0 ? 'l' : 'r';   // smaller z = closer to the camera
  }
  flag(id, on) {
    if (on) {
      this.hold[id] = (this.hold[id] || 0) + 1;
      if (this.hold[id] >= 3) {
        if (!this.live.has(id)) { this.live.add(id); this.emit({ type: 'cue', id }); }
        if (this.rep) this.rep.faults[id] = true;
      }
    } else { this.hold[id] = 0; this.live.delete(id); }
  }
  pulse(id) { this.pulses[id] = this.now + 1.3; this.emit({ type: 'cue', id }); }
  clearLive() { this.live.clear(); this.hold = {}; }
  meta(id) { return D.faults[id] || { title: 'Техника', cue: '', pen: 15 }; }
  liveList() {
    const s = new Set(this.live);
    for (const id in this.pulses) if (this.pulses[id] > this.now) s.add(id);
    return [...s].sort((a, b) => this.meta(b).pen - this.meta(a).pen);
  }
  score(rep) {
    rep.faultList = Object.keys(rep.faults).sort((a, b) => this.meta(b).pen - this.meta(a).pen);
    rep.score = Math.max(0, 100 - rep.faultList.reduce((a, id) => a + this.meta(id).pen, 0));
    rep.grade = !rep.faultList.length ? 'good' : rep.faultList.some(id => this.meta(id).pen >= 25) ? 'bad' : 'fair';
  }
  finishRep(rep) { this.score(rep); this.reps.push(rep); this.lastRepEnd = rep.t1; this.emit({ type: 'rep', rep }); }
  addLate(rep, id) { if (rep.faults[id]) return; rep.faults[id] = true; this.score(rep); this.emit({ type: 'repUpdate', rep }); this.pulse(id); }
  startRep(t, extra) {
    if (this.lock) this.closeLock();
    if (this.setEnded) { this.reps = []; this.setEnded = false; this.emit({ type: 'newSet' }); }
    this.rep = { n: this.reps.length + 1, t0: t, tBottom: t, t1: 0, down: 0, up: 0, faults: {}, extra, faultList: [], score: 100, grade: 'good' };
    this.phase = 'down';
  }
  endSet() {
    if (this.lock) this.closeLock();
    if (this.reps.length && !this.setEnded) { this.setEnded = true; this.emit({ type: 'setEnd' }); }
  }
  idleCheck(t) { if (this.lastRepEnd != null && !this.setEnded && !this.rep && t - this.lastRepEnd > 7) this.endSet(); }
  lost(t) {
    if (this.lostSince == null) this.lostSince = t;
    if (t - this.lostSince > 0.7) {
      this.status = 'nobody';
      if (this.rep) { this.rep = null; this.phase = this.cal ? 'top' : 'setup'; }
      this.clearLive();
    }
    this.idleCheck(t);
    this.m = null;
    return this.snapshot();
  }
  snapshot() {
    return { status: this.status, phase: this.phase, view: this.view, side: this.side, reps: this.reps.length,
      live: this.liveList(), setEnded: this.setEnded, kneeMode: !!(this.m && this.m.kneeMode), held: null };
  }
  closeLock() { this.lock = null; }
  joints(id) {
    const S = SIDE[this.side], v = this.view;
    return ({ shallow: v === 'front' ? [23, 24, 25, 26] : [S.hip, S.kn], lean: [S.sh, S.hip], heels: [S.heel, S.an], valgus: [25, 26],
      shift: [23, 24], lockout: v === 'front' ? [25, 26] : [S.kn, S.hip], sag: [S.hip], pike: [S.hip],
      pu_shallow: [S.el], pu_lockout: [S.el], head: [S.ear, 0] })[id] || [];
  }
}

class SquatAnalyzer extends BaseAnalyzer {
  visible(kp) {
    const ok = s => ['sh', 'hip', 'kn', 'an'].every(k => sc(kp[SIDE[s][k]]) > 0.5);
    return ok('l') || ok('r');
  }
  reset() { super.reset(); this.prevHipY = null; }
  update(kp, t) {
    const dt = this.tick(t);
    if (!kp || !this.visible(kp)) return this.lost(t);
    this.lostSince = null; this.kp = kp;
    if (this.updateView(kp) && this.cal) { this.cal = null; this.phase = 'setup'; this.rep = null; this.lock = null; this.clearLive(); }
    this.updateSide(kp, ['sh', 'hip', 'kn', 'an']);
    const front = this.view === 'front', S = SIDE[this.side];
    if (front && ![23, 24, 25, 26, 27, 28].every(i => sc(kp[i]) > 0.5)) return this.lost(t);
    let hip, kn, an, sh, heel = null, toe = null, thighNow;
    if (front) {
      hip = mid(kp[23], kp[24]); kn = mid(kp[25], kp[26]); an = mid(kp[27], kp[28]); sh = mid(kp[11], kp[12]);
      thighNow = (dist(kp[23], kp[25]) + dist(kp[24], kp[26])) / 2;
    } else {
      hip = kp[S.hip]; kn = kp[S.kn]; an = kp[S.an]; sh = kp[S.sh]; heel = kp[S.heel]; toe = kp[S.toe];
      thighNow = dist(hip, kn);
    }
    const thighVert = (kn.y - hip.y) / Math.max(1, thighNow);
    const kneeAng = front ? null : angle(hip, kn, an);
    const straight = front ? thighVert > 0.93 : kneeAng > 160;
    const ref = this.cal ? this.cal.thigh : thighNow;

class PushupAnalyzer extends BaseAnalyzer {
  visible(kp) {
    const ok = s => { const S = SIDE[s]; return ['sh', 'el', 'wr', 'hip'].every(k => sc(kp[S[k]]) > 0.5) && (sc(kp[S.an]) > 0.5 || sc(kp[S.kn]) > 0.5); };

async function loadModelWithUi() {
  if (state.detector) return true;
  showMsg('Готовлю тренера', 'Загружаю модель позы, около 9 МБ — один раз, дальше всё считается прямо на телефоне.', [], true);
  try { await ensureDetector(); hideMsg(); return true; }
  catch (e) {
    console.error(e);
    showMsg('Не загрузилось', 'Проверь интернет и попробуй ещё раз.', [{ label: 'Повторить', primary: true, run: () => { hideMsg(); startCamera(); } }]);
    return false;
  }
}
function showCameraMode(on) {
  state.on = on;
  el.howto.hidden = on; el.flip.hidden = !on || !!state.file;
  if (on) {
    try { el.howto.pause(); } catch (e) { /* fine */ }
    H.still = 0; H.lastT = -1; H.errors = 0; H.ok = 0;
    if (state.stream) { try { const p = el.vid.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* watchdog retries */ } }
  }
  else { setAspect(1, 1); try { const p = el.howto.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* fine */ } }
  renderMain(); renderLive();
}
async function startCamera() {
  stopFile();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return cameraBlocked();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: state.facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch (e) { return cameraBlocked(); }
  stopStream(); state.stream = stream;
  el.vid.muted = true; el.vid.setAttribute('playsinline', ''); el.vid.srcObject = stream;
  el.vid.classList.toggle('mirror', state.facing === 'user');
  newAnalyzer(); showCameraMode(true);          // the video is on screen before play(): hidden videos stay frozen on some phones
  try { await el.vid.play(); } catch (e) { /* the watchdog asks for a tap */ }
  setAspect(el.vid.videoWidth || 720, el.vid.videoHeight || 1280);
  requestWake();
  if (!(await loadModelWithUi())) { stopCamera(); return; }
  state.detector.reset();
}
function stopStream() {
  if (state.stream) { for (const t of state.stream.getTracks()) t.stop(); state.stream = null; }
  if (el.vid.srcObject) el.vid.srcObject = null;
}
function stopCamera() {
  const A = state.analyzer;
  if (A && A.reps.length && !A.setEnded) { A.endSet(); processEvents(A.drain()); }
  stopStream(); stopFile(); releaseWake(); state.frame = null; showCameraMode(false);
}
function cameraBlocked() {
  const tgIn = document.documentElement.classList.contains('in-telegram');
  showMsg('Нет доступа к камере', tgIn
    ? 'Разреши Telegram доступ к камере в настройках телефона и нажми «Повторить». Или выбери видео подхода из галереи.'
    : 'Разреши камеру для этой страницы (значок замка или «аА» в адресной строке) и нажми «Повторить». Или выбери видео подхода.',
    [{ label: 'Повторить', primary: true, run: () => { hideMsg(); startCamera(); } }, { label: 'Видео из галереи', run: () => { hideMsg(); $('#fileInput').click(); } }]);
}
el.stage.addEventListener('click', () => { if (state.on && el.vid.paused) { try { el.vid.play(); } catch (e) { /* fine */ } } });
el.flip.addEventListener('click', () => { state.facing = state.facing === 'user' ? 'environment' : 'user'; startCamera(); });
el.vid.addEventListener('resize', () => { if (el.vid.videoWidth && state.on) setAspect(el.vid.videoWidth, el.vid.videoHeight); });
let wake = null;
async function requestWake() { try { wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; } }
function releaseWake() { try { wake && wake.release(); } catch (e) { /* ignore */ } wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.on && !wake) requestWake(); });

/* A recorded video (when the live camera is blocked) is read frame by frame, 15 per second. */
let fileToken = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function seekTo(v, t) { return new Promise(res => { let to = 0; const done = () => { v.removeEventListener('seeked', done); clearTimeout(to); res(); }; to = setTimeout(done, 1500); v.addEventListener('seeked', done); v.currentTime = t; }); }
function stopFile() {
  fileToken++;
  if (state.file) { try { el.vid.pause(); } catch (e) { /* fine */ } el.vid.removeAttribute('src'); el.vid.load(); URL.revokeObjectURL(state.file); state.file = null; }
}
$('#fileInput').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  stopStream(); stopFile();
  state.file = URL.createObjectURL(file);
  const v = el.vid; v.srcObject = null; v.src = state.file; v.muted = true; v.classList.remove('mirror');
  const ok = await new Promise(res => { if (v.readyState >= 1) return res(true); v.addEventListener('loadedmetadata', () => res(true), { once: true }); v.addEventListener('error', () => res(false), { once: true }); });
  if (!ok || !v.videoWidth || !isFinite(v.duration)) { stopFile(); return showMsg('Видео не открылось', 'Попробуй другой файл: MP4 или MOV, снятый на телефон.', [{ label: 'Понятно', primary: true, run: hideMsg }]); }
  setAspect(v.videoWidth, v.videoHeight); newAnalyzer(); showCameraMode(true);
  if (!(await loadModelWithUi())) return stopCamera();
  const token = ++fileToken, dur = v.duration;
  state.detector.reset();
  try { await v.play(); v.pause(); } catch (err) { /* priming */ }
  for (let t = 0; token === fileToken && t <= dur; t += 1 / 15) {
    const w0 = performance.now();
    await seekTo(v, Math.min(t, Math.max(0, dur - 0.01)));
    if (token !== fileToken) return;
    try { syncSize(v); const kp = toKp(await state.detector.estimatePoses(v, { maxPoses: 1, flipHorizontal: false }, t * 1000)); state.frame = { kp, W: v.videoWidth, H: v.videoHeight }; handleSnap(state.analyzer.update(kp, t)); }
    catch (err) { console.error(err); }
    const wait = 1000 / 15 - (performance.now() - w0); if (wait > 0) await sleep(wait);
  }
  if (token === fileToken) { state.analyzer.endSet(); processEvents(state.analyzer.drain()); }
});

el.voice.addEventListener('click', () => {
  if (!('speechSynthesis' in window)) { el.voice.disabled = true; return; }
  Voice.on = !Voice.on; el.voice.setAttribute('aria-pressed', String(Voice.on));
  if (Voice.on) Voice.say('Голос включён', 'on', true); else speechSynthesis.cancel();
});
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', readColors);
new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

fillSelect(); setAspect(1, 1); resize(); setExercise(state.ex);
requestAnimationFrame(loop);

if (window.AI_TRAINER_STANDALONE) {
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache is optional */ }); });
  }
}
if (IN_TG) {
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = () => {
    const W = window.Telegram && window.Telegram.WebApp; if (!W) return;
    const call = (f, ...a) => { try { if (typeof W[f] === 'function') W[f](...a); } catch (e) { /* older Telegram */ } };
    const atLeast = v => { try { return W.isVersionAtLeast(v); } catch (e) { return false; } };
    const theme = () => {
      document.documentElement.setAttribute('data-theme', W.colorScheme === 'dark' ? 'dark' : 'light');
      if (atLeast('6.9')) { const bg = cssv('--bg'); call('setHeaderColor', bg); call('setBackgroundColor', bg); }
    };
    call('ready'); call('expand');
    if (atLeast('7.7')) call('disableVerticalSwipes');
    theme(); renderSets();
    try { W.onEvent('themeChanged', theme); } catch (e) { /* no theme events */ }
  };
  document.head.appendChild(s);
}
window.__aiTrainer = { state, AT, EX, recordSet, renderSets, setExercise, feed: (kp, t) => handleSnap(state.analyzer.update(kp, t)),
  end: () => { state.analyzer.endSet(); processEvents(state.analyzer.drain()); }, on: v => showCameraMode(v) };
})();
</script>
